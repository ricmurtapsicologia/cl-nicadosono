name: Bootstrap Clinicadosono publication

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated publication
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-*.txt | base64 --decode > /tmp/clinicadosono.tar.xz
          tar -xJf /tmp/clinicadosono.tar.xz -C .

      - name: Make project portable and update repository naming
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in Path('scripts').glob('*.py'):
              text = path.read_text(encoding='utf-8')
              text = text.replace("ROOT=Path('/mnt/data/tcci-pratica-clinica')", "ROOT=Path(__file__).resolve().parents[1]")
              text = text.replace("ROOT = Path('/mnt/data/tcci-pratica-clinica')", "ROOT = Path(__file__).resolve().parents[1]")
              path.write_text(text, encoding='utf-8')

          p = Path('PUBLISHING.md')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('`tcci-pratica-clinica`', '`clinicadosono`')
              text = text.replace('repositório chamado, por exemplo,', 'repositório')
              p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              anchor = '**Versão:** 1.0  \n'
              marker = '**Repositório:** `clinicadosono`  \n'
              if marker not in text:
                  text = text.replace(anchor, anchor + marker)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify restored publication
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/css/main.css
          test -f web/js/app.js
          test -d web/capitulos
          test "$(find web/capitulos -maxdepth 1 -name '*.html' | wc -l)" -eq 28
          test -f exports/tcci-pratica-clinica.epub
          test -f exports/tcci-pratica-clinica-digital.pdf
          test -f exports/tcci-pratica-clinica-print.pdf
          test -f exports/caderno-clinico-tcci.pdf
          test -f .github/workflows/pages.yml
          grep -q 'TCC-I na Prática Clínica' web/index.html

      - name: Replace bootstrap with final source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Clinicadosono v1.0"
          git push origin HEAD:main
