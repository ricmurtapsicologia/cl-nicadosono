name: Bootstrap Clinicadosono publication

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-*.txt | base64 --decode > /tmp/clinicadosono.tar.xz
          tar -xJf /tmp/clinicadosono.tar.xz -C .

      - name: Make project portable and update repository naming
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scripts = Path('scripts')
          for path in scripts.glob('*.py'):
              text = path.read_text(encoding='utf-8')
              text = text.replace("ROOT=Path('/mnt/data/tcci-pratica-clinica')", "ROOT=Path(__file__).resolve().parents[1]")
              text = text.replace("ROOT = Path('/mnt/data/tcci-pratica-clinica')", "ROOT = Path(__file__).resolve().parents[1]")
              path.write_text(text, encoding='utf-8')

          publishing = Path('PUBLISHING.md')
          if publishing.exists():
              text = publishing.read_text(encoding='utf-8')
              text = text.replace('`tcci-pratica-clinica`', '`clinicadosono`')
              text = text.replace('repositório chamado, por exemplo,', 'repositório')
              publishing.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              marker = '**Repositório:** `clinicadosono`  \n'
              if marker not in text:
                  anchor = '**Versão:** 1.0  \n'
                  text = text.replace(anchor, anchor + marker)
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
          python -m pip install --upgrade pip
          python -m pip install weasyprint pypdf cairosvg

      - name: Build publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_assets.py
          bash scripts/build_all.sh

      - name: Verify publication
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f exports/tcci-pratica-clinica.epub
          test -f exports/tcci-pratica-clinica-digital.pdf
          test -f exports/tcci-pratica-clinica-print.pdf
          test -f exports/caderno-clinico-tcci.pdf
          grep -q 'TCC-I na Prática Clínica' web/index.html

      - name: Commit generated publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Publish Clinicadosono v1.0"
          git push origin HEAD:main
