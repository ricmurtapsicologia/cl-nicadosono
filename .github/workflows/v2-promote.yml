name: TCC-I v2 release candidate gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v2-source-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore original source and verified v2 overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bootstrap -name 'chunk-*.txt' | wc -l)" -eq 13
          cat bootstrap/chunk-*.txt | base64 --decode > /tmp/tcci.tar.xz
          xz -t /tmp/tcci.tar.xz
          tar -xJf /tmp/tcci.tar.xz -C .
          test "$(find v2-overlay -name 'part-*.txt' | wc -l)" -eq 5
          cat v2-overlay/part-*.txt | tr -d '\r\n ' | base64 --decode > /tmp/v2overlay.tar.gz
          echo '90a942c57bbc3298e786aa7f4616a887dfdab8eb9c50b9b4a122246b3e2702c4  /tmp/v2overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v2overlay.tar.gz -C .
          cp v2-extra/print-v2.css src/styles/print-v2.css
          cp v2-extra/epub-v2.css src/styles/epub-v2.css

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install weasyprint pypdf cairosvg beautifulsoup4 PyYAML Pillow

      - name: Prepare canonical v2 source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_assets.py
          mkdir -p src
          rm -rf src/content src/assets src/references src/editorial
          cp -a content src/content
          cp -a assets src/assets
          cp -a references src/references
          cp -a editorial src/editorial
          mkdir -p src/data src/styles
          cp data/manifest.json src/data/manifest.json
          cp v2-extra/print-v2.css src/styles/print-v2.css
          cp v2-extra/epub-v2.css src/styles/epub-v2.css
          test "$(find src/content -maxdepth 1 -name '*.md' | wc -l)" -ge 30
          test "$(find src/assets/diagrams -name '*.svg' | wc -l)" -ge 9
          test "$(find src/assets/icons -name '*.svg' | wc -l)" -ge 14

      - name: Build Web, EPUB, PDFs and Caderno
        run: npm run build

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          test "$(find dist/web/capitulos -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 28
          ! grep -R -q 'atob(' dist/web
          ! grep -R -q 'payload4/' dist/web
          test -s dist/exports/tcci-pratica-clinica.epub
          test -s dist/exports/tcci-pratica-clinica-digital.pdf
          test -s dist/exports/tcci-pratica-clinica-print.pdf
          test -s dist/exports/caderno-clinico-tcci.pdf

      - name: Assemble clean release tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          cp -a dist/web/. /tmp/release/
          mkdir -p /tmp/release/exports
          cp -a dist/exports/. /tmp/release/exports/
          cp -a src /tmp/release/src
          cp -a scripts /tmp/release/scripts
          cp -a tests /tmp/release/tests
          cp -a clinical-tools /tmp/release/clinical-tools
          cp -a CITATION.cff REVIEWER_PROTOCOL.md QA_REPORT.md package.json /tmp/release/
          printf 'v2.0.0-rc1\n' > /tmp/release/VERSION
          : > /tmp/release/.nojekyll
          cat > /tmp/release/README.md <<'EOF'
          # TCC-I na Prática Clínica — v2.0.0-rc1

          Publicação clínica e educacional para psicólogos. Uma única fonte editorial em `src/` gera Web Book, EPUB 3, PDF digital, PDF print e Caderno Clínico.

          O Web Book usa 28 páginas HTML reais, PWA/offline, busca, progresso, favoritos, notas privadas locais, preferências de leitura, rotas de aprendizagem, casos longitudinais e exercícios interativos. O conteúdo principal continua legível sem JavaScript.

          Estado: release candidate. A versão 2.0.0 final depende de revisão clínica humana independente e prova física da edição print. Consulte `QA_REPORT.md` e `REVIEWER_PROTOCOL.md`.
          EOF
          cat > /tmp/release/CHANGELOG.md <<'EOF'
          # Changelog

          ## 2.0.0-rc1 — 2026-08-08
          - fonte-mestre única restaurada;
          - Web Book estático com 28 URLs reais;
          - remoção de Base64/atob da leitura;
          - PWA/offline, busca, progresso, favoritos e notas locais;
          - rotas de aprendizagem, casos e interatividade didática;
          - EPUB/PDF/Caderno recompilados da mesma fonte;
          - gates automatizados de paridade, links, semântica e integridade.
          EOF

      - name: Promote only validated release to main
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/. .
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/workflows/v2-promote.yml" /tmp/v2-promote.yml 2>/dev/null || true
          if test -s /tmp/v2-promote.yml; then cp /tmp/v2-promote.yml .github/workflows/v2-promote.yml; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: TCC-I v2.0.0-rc1 — validated multi-format publication'
          git push --force origin HEAD:main
